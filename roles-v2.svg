    <text x="442" y="162" font-size="16" fill="#a5b4fc">I work on the platform and the</text>
    <text x="442" y="186" font-size="16" fill="#a5b4fc">challenges behind our CTFs.</text>

    <rect x="800" y="30" width="360" height="200" rx="16" fill="#11172b" stroke="#818cf8" stroke-opacity="0.35"/>
