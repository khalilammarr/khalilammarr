    <text x="62" y="162" font-size="16" fill="#a5b4fc">Studying at the National Institute</text>
    <text x="62" y="186" font-size="16" fill="#a5b4fc">of Applied Science and Technology.</text>

    <rect x="420" y="30" width="360" height="200" rx="16" fill="#11172b" stroke="#818cf8" stroke-opacity="0.35"/>
