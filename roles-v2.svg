    <rect x="62" y="54" width="110" height="24" rx="12" fill="#818cf8" fill-opacity="0.18"/>
    <text x="77" y="71" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#c7d2fe">STUDENT</text>
