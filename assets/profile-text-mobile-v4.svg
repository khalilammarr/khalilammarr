<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1035" viewBox="0 0 480 1035" role="img">
<title>Khalil Ammar — security research, mobile security, reversing, CTFs, and AI agent systems</title>
<defs>
  <radialGradient id="washA" cx=".05" cy="0" r=".7"><stop stop-color="#163128" stop-opacity=".42"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient>
  <radialGradient id="washB" cx="1" cy=".15" r=".75"><stop stop-color="#2b2745" stop-opacity=".55"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="480" height="1035" rx="20" fill="#0a0d14"/>
<rect x="1" y="1" width="478" height="1033" rx="19" fill="none" stroke="#282d3f"/>
<rect x="7" y="7" width="466" height="1021" rx="14" fill="#11141e"/>
<rect x="7" y="7" width="466" height="1021" rx="14" fill="url(#washA)"/>
