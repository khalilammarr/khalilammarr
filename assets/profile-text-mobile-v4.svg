<text x="24" y="38" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#82d5bb" letter-spacing="1.2">FADIGAA</text><text x="24" y="76" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="#eef0f7">Khalil Ammar.</text><text x="24" y="102" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#aaa2ff">INSAT / SECURINETS TECHNICAL TEAM</text><path d="M24 126H456" stroke="#303548"/><text x="24" y="155" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#82d5bb" letter-spacing="1.1">ABOUT</text><text x="24" y="184" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">I’m a Networks and Telecommunications engineering</text><text x="24" y="205" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">student at INSAT and part of the Securinets</text><text x="24" y="226" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">technical team. I play CTFs, write challenges,</text><text x="24" y="247" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">and hunt for bugs.</text><text x="24" y="285" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">My main interests are malware analysis, reverse</text><text x="24" y="306" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">engineering, and mobile security. I spend time</text><text x="24" y="327" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">tracing application behavior, reading decompiled</text><text x="24" y="348" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">code, debugging binaries, and testing how apps</text><text x="24" y="369" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#abb3c5">handle data and trust.</text><path d="M24 397H456" stroke="#303548"/><text x="24" y="426" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#82d5bb" letter-spacing="1.1">01 / SECURITY</text><text x="24" y="459" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#eef0f7">What I work on</text><text x="24" y="491" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#aaa2ff">01</text><text x="54" y="491" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#eef0f7">Mobile security</text><text x="24" y="519" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">App reversing, runtime instrumentation, local storage,</text><text x="24" y="537" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">authentication, and certificate pinning. Android so</text><text x="24" y="555" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">far; iOS next.</text><text x="24" y="595" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#aaa2ff">02</text><text x="54" y="595" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#eef0f7">Malware analysis &amp; reversing</text><text x="24" y="623" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">Understanding program behavior, unpacking binaries,</text><text x="24" y="641" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">and working through anti-debugging checks.</text><text x="24" y="681" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#aaa2ff">03</text><text x="54" y="681" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#eef0f7">Bug bounty</text><text x="24" y="709" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">Looking for vulnerabilities in web and mobile</text><text x="24" y="727" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">applications.</text><text x="24" y="767" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#aaa2ff">04</text><text x="54" y="767" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#eef0f7">CTFs</text><text x="24" y="795" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">Competing, writing challenges, and helping run the</text><text x="24" y="813" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">infrastructure behind them.</text><path d="M24 835H456" stroke="#303548"/><text x="24" y="863" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#82d5bb" letter-spacing="1.0">02 / AI &amp; AGENT SYSTEMS</text><text x="24" y="893" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">I explore how to get more out of AI through multi-agent</text><text x="24" y="911" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">orchestration, context engineering, and tool-augmented</text><text x="24" y="929" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">workflows. I’m interested in task decomposition,</text><text x="24" y="947" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">memory, and feedback loops—how agents coordinate,</text><text x="24" y="965" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">verify their outputs, and support security research and</text><text x="24" y="983" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">development within practical token, latency, and cost</text><text x="24" y="1001" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">budgets.</text></svg>