<title id="t">Khalil Ammar</title>
<desc id="d">Khalil Ammar   aka fadigaa Cybersecurity  enthusiast and engineering student. I like finding out how systems really work, and then how they break:  reverse engineering , web and mobile apps, networks and the detections that are supposed to catch it all. Networks &amp; telecom engineering at  INSAT , Tunis. Technical team at  Securinets INSAT : I write CTF challenges, run workshops and help first-years get started. Off hours I play CTFs with  MOJO-JOJO .</desc>
