<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="459" viewBox="0 0 480 459" role="img"><title>AI &amp; agent systems — I explore how to get more out of AI through multi-agent orchestration, context engineering, and tool-augmented workflows. I’m interested in task decomposition, memory, and feedback loops—how agents coordinate, verify their outputs, and support security research and development within practical token, latency, and cost budgets.</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="480" height="459" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="478" height="457" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="464" height="443" rx="16" fill="#11141e"/><rect x="8" y="8" width="464" height="443" rx="16" fill="url(#wash)"/><text x="24" y="37" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#85d6bc">02 / AI</text><text x="24" y="74" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#edf0f7">AI &amp; agent systems</text><text x="24" y="110" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">I explore how to get more out of AI</text><text x="24" y="136" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">through multi-agent orchestration,</text><text x="24" y="162" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">context engineering, and tool-augmented</text><text x="24" y="188" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">workflows. I’m interested in task</text><text x="24" y="214" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">decomposition, memory, and feedback</text><text x="24" y="240" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">loops—how agents coordinate, verify</text><text x="24" y="266" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">their outputs, and support security</text><text x="24" y="292" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">research and development within</text><text x="24" y="318" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">practical token, latency, and cost</text><text x="24" y="344" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b0b9cc">budgets.</text><path d="M24 374H456" stroke="#343748"/><text x="24" y="404" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#aba3ff">DECOMPOSE → COORDINATE → VERIFY</text><text x="24" y="427" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#85d6bc">↳ FEEDBACK LOOPS</text></svg>