<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="925" viewBox="0 0 800 925" role="img"><title>What I work on — Mobile security, malware analysis and reversing, bug bounty, CTFs</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="800" height="925" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="798" height="923" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="784" height="909" rx="16" fill="#11141e"/><rect x="8" y="8" width="784" height="909" rx="16" fill="url(#wash)"/><text x="44" y="59" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#85d6bc">01 / SECURITY</text><text x="44" y="111" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#edf0f7">What I work on</text><text x="44" y="179" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#aba3ff">01</text><text x="94" y="181" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#edf0f7">Mobile security</text><text x="94" y="227" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">App reversing, runtime instrumentation, local</text><text x="94" y="261" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">storage, authentication, and certificate</text><text x="94" y="295" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">pinning.</text><text x="94" y="338" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#b0b9cc">My work so far has focused on Android; I plan</text><text x="94" y="371" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#b0b9cc">to explore iOS too.</text><path d="M94 386H756" stroke="#303447"/><text x="44" y="423" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#aba3ff">02</text><text x="94" y="425" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#edf0f7">Malware analysis &amp; reversing</text><text x="94" y="471" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">Understanding program behavior, unpacking</text><text x="94" y="505" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">binaries, and working through anti-debugging</text><text x="94" y="539" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">checks.</text><path d="M94 574H756" stroke="#303447"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#aba3ff">03</text><text x="94" y="615" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#edf0f7">Bug bounty</text><text x="94" y="661" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">Looking for vulnerabilities in web and mobile</text><text x="94" y="695" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">applications.</text><path d="M94 730H756" stroke="#303447"/><text x="44" y="767" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#aba3ff">04</text><text x="94" y="769" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#edf0f7">CTFs</text><text x="94" y="815" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">Competing, writing challenges, and helping run</text><text x="94" y="849" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b0b9cc">the infrastructure behind them.</text></svg>