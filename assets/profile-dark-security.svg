<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="460" viewBox="0 0 800 460" role="img"><title>What I work on — Mobile security, malware analysis and reversing, bug bounty, CTFs</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="800" height="460" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="798" height="458" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="784" height="444" rx="16" fill="#11141e"/><rect x="8" y="8" width="784" height="444" rx="16" fill="url(#wash)"/><text x="32" y="38" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#85d6bc">01 / SECURITY</text><text x="32" y="76" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#edf0f7">What I work on</text><text x="32" y="120" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#aba3ff">01</text><text x="62" y="120" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edf0f7">Mobile security</text><text x="32" y="154" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">App reversing, runtime</text><text x="32" y="178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">instrumentation, local storage,</text><text x="32" y="202" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">authentication, and certificate</text><text x="32" y="226" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">pinning.</text><text x="32" y="260" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">My work so far has focused on</text><text x="32" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">Android; I plan to explore iOS too.</text><text x="420" y="120" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#aba3ff">02</text><text x="450" y="120" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edf0f7">Malware analysis</text><text x="450" y="146" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edf0f7">&amp; reversing</text><text x="420" y="177" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">Understanding program behavior,</text><text x="420" y="201" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">unpacking binaries, and working</text><text x="420" y="225" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">through anti-debugging checks.</text><text x="32" y="344" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#aba3ff">03</text><text x="62" y="344" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edf0f7">Bug bounty</text><text x="32" y="378" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">Looking for vulnerabilities in web</text><text x="32" y="402" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">and mobile applications.</text><text x="420" y="344" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#aba3ff">04</text><text x="450" y="344" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#edf0f7">CTFs</text><text x="420" y="378" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">Competing, writing challenges, and</text><text x="420" y="402" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">helping run the infrastructure behind</text><text x="420" y="426" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b0b9cc">them.</text><path d="M400 107V425M32 309H768" stroke="#303447"/></svg>