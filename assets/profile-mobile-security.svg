<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="700" viewBox="0 0 480 700" role="img"><title>What I work on</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="480" height="700" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="478" height="698" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="464" height="684" rx="16" fill="#11141e"/><rect x="8" y="8" width="464" height="684" rx="16" fill="url(#wash)"/><text x="24" y="37" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#85d6bc">01 / SECURITY</text><text x="24" y="74" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#edf0f7">What I work on</text><text x="24" y="116" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#aba3ff">01</text><text x="54" y="116" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#edf0f7">Mobile security</text><text x="24" y="146" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">App reversing, runtime instrumentation,</text><text x="24" y="172" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">local storage, authentication, and</text><text x="24" y="198" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">certificate pinning.</text><text x="24" y="230" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">My work so far has focused on Android; I</text><text x="24" y="256" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">plan to explore iOS too.</text><path d="M24 284H456" stroke="#343748"/><text x="24" y="320" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#aba3ff">02</text><text x="54" y="320" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#edf0f7">Malware analysis &amp; reversing</text><text x="24" y="350" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">Understanding program behavior,</text><text x="24" y="376" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">unpacking binaries, and working through</text><text x="24" y="402" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">anti-debugging checks.</text><path d="M24 430H456" stroke="#343748"/><text x="24" y="466" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#aba3ff">03</text><text x="54" y="466" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#edf0f7">Bug bounty</text><text x="24" y="496" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">Looking for vulnerabilities in web and</text><text x="24" y="522" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">mobile applications.</text><path d="M24 550H456" stroke="#343748"/><text x="24" y="586" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#aba3ff">04</text><text x="54" y="586" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#edf0f7">CTFs</text><text x="24" y="616" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">Competing, writing challenges, and</text><text x="24" y="642" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">helping run the infrastructure behind</text><text x="24" y="668" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#b0b9cc">them.</text></svg>