<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="1060" viewBox="0 0 480 1060" role="img"><title>What I work on</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="480" height="1060" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="478" height="1058" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="464" height="1044" rx="16" fill="#11141e"/><rect x="8" y="8" width="464" height="1044" rx="16" fill="url(#wash)"/><text x="28" y="49" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#85d6bc">01 / SECURITY</text><text x="28" y="96" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#edf0f7">What I work on</text><text x="28" y="160" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#aba3ff">01</text><text x="66" y="160" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#edf0f7">Mobile security</text><text x="28" y="205" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">App reversing, runtime</text><text x="28" y="236" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">instrumentation, local storage,</text><text x="28" y="267" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">authentication, and certificate</text><text x="28" y="298" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">pinning.</text><text x="28" y="339" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">My work so far has focused on</text><text x="28" y="370" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">Android; I plan to explore iOS</text><text x="28" y="401" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">too.</text><path d="M28 439H452" stroke="#343748"/><text x="28" y="495" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#aba3ff">02</text><text x="66" y="495" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#edf0f7">Malware analysis</text><text x="66" y="529" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#edf0f7">&amp; reversing</text><text x="28" y="574" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">Understanding program behavior,</text><text x="28" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">unpacking binaries, and working</text><text x="28" y="636" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">through anti-debugging checks.</text><path d="M28 674H452" stroke="#343748"/><text x="28" y="730" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#aba3ff">03</text><text x="66" y="730" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#edf0f7">Bug bounty</text><text x="28" y="775" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">Looking for vulnerabilities in web</text><text x="28" y="806" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">and mobile applications.</text><path d="M28 844H452" stroke="#343748"/><text x="28" y="900" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#aba3ff">04</text><text x="66" y="900" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#edf0f7">CTFs</text><text x="28" y="945" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">Competing, writing challenges, and</text><text x="28" y="976" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">helping run the infrastructure</text><text x="28" y="1007" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#b0b9cc">behind them.</text></svg>