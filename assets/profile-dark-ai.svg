<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="660" viewBox="0 0 800 660" role="img"><title>AI &amp; agent systems — I explore how to get more out of AI through multi-agent orchestration, context engineering, and tool-augmented workflows. I’m interested in task decomposition, memory, and feedback loops—how agents coordinate, verify their outputs, and support security research and development within practical token, latency, and cost budgets.</title><defs><radialGradient id="wash" cx="1" cy="0" r="1"><stop stop-color="#292540" stop-opacity=".65"/><stop offset="1" stop-color="#11141e" stop-opacity="0"/></radialGradient></defs><rect width="800" height="660" rx="22" fill="#0c0f17"/><rect x="1" y="1" width="798" height="658" rx="21" fill="none" stroke="#282c3d"/><rect x="8" y="8" width="784" height="644" rx="16" fill="#11141e"/><rect x="8" y="8" width="784" height="644" rx="16" fill="url(#wash)"/><text x="44" y="59" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#85d6bc">02 / AI</text><text x="44" y="111" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#edf0f7">AI &amp; agent systems</text><text x="44" y="166" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">I explore how to get more out of AI through multi-</text><text x="44" y="202" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">agent orchestration, context engineering, and tool-</text><text x="44" y="238" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">augmented workflows. I’m interested in task</text><text x="44" y="274" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">decomposition, memory, and feedback loops—how agents</text><text x="44" y="310" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">coordinate, verify their outputs, and support</text><text x="44" y="346" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">security research and development within practical</text><text x="44" y="382" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b0b9cc">token, latency, and cost budgets.</text><path d="M44 462H756" stroke="#343748"/><rect x="44" y="494" width="216" height="64" rx="12" fill="#1c2030" stroke="#3d405a"/><text x="67" y="533" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#aba3ff">DECOMPOSE</text><rect x="292" y="494" width="216" height="64" rx="12" fill="#1c2030" stroke="#3d405a"/><text x="315" y="533" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#aba3ff">COORDINATE</text><rect x="540" y="494" width="216" height="64" rx="12" fill="#1c2030" stroke="#3d405a"/><text x="563" y="533" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#aba3ff">VERIFY</text><path d="M260 526H286m-7-5 7 5-7 5M508 526H534m-7-5 7 5-7 5" fill="none" stroke="#85d6bc" stroke-width="2"/><path d="M648 574V603H152V574m-5 7 5-7 5 7" fill="none" stroke="#85d6bc" stroke-opacity=".7" stroke-width="2"/><rect x="297" y="586" width="206" height="30" fill="#11141e"/><text x="317" y="608" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#85d6bc">FEEDBACK LOOPS</text></svg>