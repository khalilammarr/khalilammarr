<text x="30" y="38" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#82d5bb" letter-spacing="1.4">FADIGAA</text><text x="30" y="76" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#eef0f7">Khalil Ammar.</text><text x="30" y="101" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#aaa2ff" letter-spacing=".5">NETWORKS &amp; TELECOMMUNICATIONS / INSAT / SECURINETS</text><path d="M30 126H770" stroke="#303548"/><text x="30" y="154" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#82d5bb" letter-spacing="1.2">ABOUT</text><text x="30" y="181" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">I’m a Networks and Telecommunications engineering student</text><text x="30" y="199" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">at INSAT and part of the Securinets technical team. I play</text><text x="30" y="217" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">CTFs, write challenges, and hunt for bugs.</text><text x="414" y="181" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">My main interests are malware analysis, reverse</text><text x="414" y="199" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">engineering, and mobile security. I spend time tracing</text><text x="414" y="217" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">application behavior, reading decompiled code, debugging</text><text x="414" y="235" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#abb3c5">binaries, and testing how apps handle data and trust.</text><path d="M30 254H770" stroke="#303548"/><text x="30" y="282" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#82d5bb" letter-spacing="1.2">01 / SECURITY</text><text x="30" y="314" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#eef0f7">What I work on</text><rect x="30" y="340" width="356" height="94" rx="11" fill="#171b28" stroke="#33384d"/><text x="44" y="364" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#aaa2ff">01</text><text x="72" y="364" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#eef0f7">Mobile security</text><text x="44" y="390" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">App reversing, runtime instrumentation, local</text><text x="44" y="405" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">storage, authentication, and certificate pinning.</text><text x="44" y="420" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">Android so far; iOS next.</text><rect x="414" y="340" width="356" height="94" rx="11" fill="#171b28" stroke="#33384d"/><text x="428" y="364" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#aaa2ff">02</text><text x="456" y="364" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#eef0f7">Malware analysis &amp; reversing</text><text x="428" y="390" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">Understanding program behavior, unpacking</text><text x="428" y="405" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">binaries, and working through anti-debugging</text><text x="428" y="420" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">checks.</text><rect x="30" y="454" width="356" height="94" rx="11" fill="#171b28" stroke="#33384d"/><text x="44" y="478" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#aaa2ff">03</text><text x="72" y="478" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#eef0f7">Bug bounty</text><text x="44" y="504" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">Looking for vulnerabilities in web and mobile</text><text x="44" y="519" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">applications.</text><rect x="414" y="454" width="356" height="94" rx="11" fill="#171b28" stroke="#33384d"/><text x="428" y="478" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#aaa2ff">04</text><text x="456" y="478" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#eef0f7">CTFs</text><text x="428" y="504" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">Competing, writing challenges, and helping run the</text><text x="428" y="519" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400" fill="#abb3c5">infrastructure behind them.</text><path d="M30 570H770" stroke="#303548"/><text x="30" y="597" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#82d5bb" letter-spacing="1.1">02 / AI &amp; AGENT SYSTEMS</text><text x="30" y="624" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#abb3c5">I explore how to get more out of AI through multi-agent orchestration, context engineering, and tool-augmented</text><text x="30" y="640" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#abb3c5">workflows. I’m interested in task decomposition, memory, and feedback loops—how agents coordinate, verify their</text><text x="30" y="656" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#abb3c5">outputs, and support security research and development within practical token, latency, and cost budgets.</text></svg>