    <rect x="800" y="66" width="360" height="186" rx="14" fill="#11172b" stroke="#818cf8" stroke-opacity="0.35"/>
    <rect x="822" y="88" width="106" height="22" rx="11" fill="#f4f5fb" fill-opacity="0.08"/>
